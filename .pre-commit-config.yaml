repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  # LaTeX linting (uses system-installed chktex)
  - repo: https://github.com/meliache/pre-commit-chktex
    rev: v0.2.1
    hooks:
      - id: chktex-system

  # PII guard (custom local hook)
  - repo: local
    hooks:
      - id: pii-guard
        name: PII Guard (pattern + blocklist)
        language: script
        entry: scripts/pii_guard.sh
        files: '\.(tex|cls)$'
        pass_filenames: true
